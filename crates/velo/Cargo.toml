[package]
name = "velo"
version = "0.1.0"
edition = "2021"
description = "The unified, high-performance fine-grained reactive full-stack web framework."
license = "MIT"
repository = "https://github.com/digiator42/Velo"
keywords = ["wasm", "reactive", "frontend", "dom", "web"]
categories = ["wasm", "web-programming"]

[dependencies]
velo_macro = { path = "../macro" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
percent-encoding = "2.1"
inventory = "0.3"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Typed `fetch_json::<T>(url)` / `response.json::<T>()` via serde JSON parsing.
# Off by default to keep the WASM core small; enable it only when you need
# typed payload decoding from the `velo::fetch` wrapper.
json = ["serde", "serde_json", "wasm-bindgen/serde-serialize"]

[dependencies.web-sys]
workspace = true
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "DocumentFragment",
    "Node",
    "Text",
    "Window",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "console",
    "Storage",
    "DragEvent",
    "DataTransfer",
    "DataTransferItemList",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCredentials",
    "RequestCache",
    "RequestRedirect",
    "Response",
    "ResponseInit",
    "AbortController",
    "AbortSignal",
    "History",
    "Location",
    "CssStyleDeclaration",
    "DomTokenList",
    "HtmlCollection",
    "DomRect",
    "PopStateEvent",
]
