[package]
name = "velo_dom"
version = "0.1.0"
edition = "2021"

[dependencies]
velo_core = { path = "../core" }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Text",
    "Window",
    "Event",
    "MouseEvent",
]
