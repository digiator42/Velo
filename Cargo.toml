[workspace]
members = [
    "crates/velo",
    "crates/macro",
    "examples/counter-spa", "examples/server-monitor-dashboard",
    "examples/features-demo",
    "examples/todo-app",
    "examples/async-dashboard",
    "examples/blog",
    "examples/layout-children",
    "examples/error-overlay",
    "examples/memo-unwrap-check",
    "examples/arrow-closures",
    "examples/dynamic",
    "examples/new-features",
]
resolver = "2"

# Centralized dependency management for the workspace
[workspace.dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"

# Release profile tuned for ultra-fast, tiny WebAssembly binaries
[profile.release]
opt-level = "z"   # Optimize for size while keeping high execution speed
lto = true        # Link-Time Optimization across all crates
codegen-units = 1 # Maximize optimization at the cost of compile time
panic = "abort"   # Drop panic strings to heavily reduce binary bloat
