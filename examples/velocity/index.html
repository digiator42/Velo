<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velocity — Project Management</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --radius: 8px;
        }
        .app-shell.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #334155;
            --border: #374151;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --accent-hover: #6366f1;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
        /* Layout */
        .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .app-shell.collapsed { grid-template-columns: 60px 1fr; }
        .main-content { padding: 24px 32px; max-width: 1200px; }
        /* Sidebar */
        .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; }
        .brand { font-weight: 700; font-size: 18px; padding: 0 12px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .nav a { display: block; padding: 8px 12px; border-radius: 6px; color: var(--text-muted); text-decoration: none; margin-bottom: 4px; }
        .nav a:hover { background: var(--surface-2); color: var(--text); }
        .nav a.active { background: var(--accent); color: white; }
        .user { padding: 12px; font-size: 13px; color: var(--text-muted); }
        .theme-toggle { width: 100%; margin-top: 8px; background: var(--surface-2); color: var(--text); }
        /* Dashboard */
        .dashboard { max-width: 1200px; }
        .subtitle { color: var(--text-muted); margin: 4px 0 24px; }
        .projects-section h2, .chart-section h3, .activity-feed h2 { margin: 24px 0 12px; }
        .board-list { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .board-list a { display: block; padding: 12px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--accent); text-decoration: none; font-weight: 500; }
        .board-list a:hover { border-color: var(--accent); background: var(--surface-2); }
        .search-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
        .search-bar input { flex: 1; }
        .hint { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card h3 { margin: 0 0 4px; font-size: 13px; color: var(--text-muted); }
        .stat-value { font-size: 28px; font-weight: 700; }
        /* Chart */
        .chart-section { margin-bottom: 24px; }
        .chart { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .chart h3 { margin: 0 0 12px; }
        .chart p { margin: 4px 0; color: var(--text-muted); }
        /* Activity */
        .activity-feed { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        .activity-item { padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
        .activity-item .target { color: var(--accent); }
        /* Board */
        .board-page { max-width: 1200px; }
        .board-header { margin-bottom: 24px; }
        .board-header h1 { margin: 0 0 12px; }
        .board-header .search-box { margin-bottom: 12px; }
        .board-view { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; }
        .board-actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
        .board-actions a { color: var(--accent); text-decoration: none; }
        /* Filters / Quick-add */
        .filters { display: flex; gap: 8px; margin-bottom: 12px; }
        .filters button { font-size: 12px; padding: 4px 12px; }
        .filters button.active { background: var(--accent); color: white; }
        .filters button:not(.active) { background: var(--surface-2); color: var(--text); }
        .quick-add form { display: flex; gap: 8px; }
        .quick-add input { flex: 1; }
        /* Kanban */
        .kanban-column { background: var(--surface-2); border-radius: var(--radius); min-width: 280px; max-width: 320px; padding: 12px; flex-shrink: 0; }
        .column-header { font-weight: 600; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
        .column-count { background: var(--border); border-radius: 10px; padding: 2px 8px; font-size: 12px; }
        /* Task cards */
        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; cursor: pointer; margin-bottom: 8px; }
        .task-card:hover { border-color: var(--accent); }
        .task-card.overdue { border-left: 3px solid #dc2626; }
        .task-card-header { display: flex; gap: 6px; margin-bottom: 6px; }
        .task-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .task-assignee { font-size: 12px; color: var(--text-muted); }
        /* Badges */
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .badge--todo { background: var(--surface-2); color: var(--text-muted); }
        .badge--in-progress { background: #dbeafe; color: #1d4ed8; }
        .badge--done { background: #d1fae5; color: #059669; }
        .badge--high { background: #fee2e2; color: #dc2626; }
        .badge--medium { background: #fef3c7; color: #d97706; }
        .badge--low { background: var(--surface-2); color: var(--text-muted); }
        /* Task detail */
        .overlay-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .task-detail { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow: auto; position: relative; }
        .task-detail h2 { margin: 0 0 16px; }
        .task-detail .label { color: var(--text-muted); font-size: 12px; margin: 0 0 2px; }
        .task-detail .value { margin: 0 0 16px; }
        .task-meta { display: flex; gap: 8px; align-items: center; margin: 16px 0; }
        .close { position: absolute; top: 12px; right: 12px; background: var(--surface-2); color: var(--text); width: 28px; height: 28px; padding: 0; font-size: 16px; border-radius: 50%; }
        /* Forms */
        input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 14px; }
        button { padding: 8px 16px; border: none; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; font-size: 14px; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: var(--surface-2); color: var(--text); }
        .form-group { margin-bottom: 12px; }
        /* Settings */
        .settings-page { max-width: 800px; }
        .settings-page h1 { margin: 0 0 24px; }
        .settings-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
        .settings-section h2 { margin: 0 0 12px; font-size: 16px; }
        .settings-section label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
        /* Error / Not Found */
        .recovered, .not-found { text-align: center; padding: 80px 20px; }
        .recovered h1, .not-found h1 { font-size: 48px; margin: 0 0 16px; color: var(--accent); }
        .not-found p { color: var(--text-muted); }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        /* Shortcuts */
        .shortcuts { margin-top: 16px; }
        /* Misc */
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
</head>
<body>
</body>
</html>
