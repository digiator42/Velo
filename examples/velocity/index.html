<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velocity — Project Management</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --radius: 8px;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #334155;
            --border: #374151;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --accent-hover: #6366f1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; }
        .sidebar-header { font-weight: 700; font-size: 18px; padding: 0 12px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .sidebar-nav a { display: block; padding: 8px 12px; border-radius: 6px; color: var(--text-muted); text-decoration: none; margin-bottom: 4px; }
        .sidebar-nav a:hover { background: var(--surface-2); color: var(--text); }
        .sidebar-nav a.is-active { background: var(--accent); color: white; }
        .main { padding: 24px 32px; max-width: 1200px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card h3 { margin: 0 0 4px; font-size: 13px; color: var(--text-muted); }
        .stat-value { font-size: 28px; font-weight: 700; }
        .board-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .board-header h1 { margin: 0; flex: 1; }
        .columns { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; }
        .column { background: var(--surface-2); border-radius: var(--radius); min-width: 280px; max-width: 320px; padding: 12px; }
        .column-header { font-weight: 600; padding: 8px; display: flex; justify-content: space-between; }
        .column-header .count { background: var(--border); border-radius: 10px; padding: 2px 8px; font-size: 12px; }
        .task-list { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; cursor: pointer; }
        .task-card:hover { border-color: var(--accent); }
        .task-card h4 { margin: 0 0 6px; font-size: 14px; }
        .task-meta { display: flex; gap: 8px; align-items: center; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .badge--todo { background: var(--surface-2); color: var(--text-muted); }
        .badge--in-progress { background: #dbeafe; color: #1d4ed8; }
        .badge--done { background: #d1fae5; color: #059669; }
        .badge--high { background: #fee2e2; color: #dc2626; }
        .badge--medium { background: #fef3c7; color: #d97706; }
        .badge--low { background: var(--surface-2); color: var(--text-muted); }
        .overlay-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .task-detail { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow: auto; }
        .task-detail h2 { margin: 0 0 16px; }
        .task-detail .label { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }
        .task-detail .value { margin-bottom: 16px; }
        input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 14px; }
        button { padding: 8px 16px; border: none; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; font-size: 14px; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: var(--surface-2); color: var(--text); }
        .form-group { margin-bottom: 12px; }
        .not-found { text-align: center; padding: 80px 20px; }
        .not-found h1 { font-size: 64px; margin: 0; color: var(--accent); }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
</head>
<body>
</body>
</html>
