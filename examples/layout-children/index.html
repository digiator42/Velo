<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velo Layout · Children</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
        a { color: #7dd3fc; text-decoration: none; font-weight: 600; padding: 0.4rem 0.6rem; border-radius: 6px; }
        a:hover { background: #1e293b; }
        nav { display: flex; gap: 8px; align-items: center; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #111827; border-bottom: 1px solid #1f2937; }
        .brand { font-weight: 800; color: #38bdf8; font-size: 1.1rem; }
        button { background: transparent; border: 1px solid #334155; color: #a5f3fc; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1e293b; }
        main { padding: 32px 24px; max-width: 720px; margin: 0 auto; }
        .posts-toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border: 1px solid #1f2937; border-radius: 10px; background: #111827; margin-bottom: 16px; }
        .pill { background: #1e293b; border: 1px solid #334155; color: #7dd3fc; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
        .feed { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
        .post-card { border: 1px solid #1f2937; border-radius: 12px; padding: 18px 20px; background: #111827; }
        .post-card h2 { margin: 0 0 4px; color: #f1f5f9; }
        .meta { margin: 0 0 12px; color: #94a3b8; font-size: 0.85rem; }
        .body { margin: 0; color: #cbd5e1; line-height: 1.5; }
        .card-footer { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #334155; color: #64748b; font-size: 0.85rem; }
        .panel { border: 1px solid #334155; border-radius: 12px; background: #0b1220; margin-bottom: 16px; }
        .panel-title { margin: 0; padding: 12px 18px; border-bottom: 1px solid #334155; color: #38bdf8; }
        .panel-body { padding: 14px 18px; color: #cbd5e1; line-height: 1.6; }
        code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #a5f3fc; }
        h1 { margin-top: 0; }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
</head>
<body>
    <div id="app"></div>
</body>
</html>
