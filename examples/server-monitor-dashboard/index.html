<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velo SPA Test Engine</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f19; color: #f3f4f6; }
        nav { display: flex; gap: 20px; padding: 15px 30px; background: #111827; border-bottom: 1px solid #1f2937; }
        a { color: #4ade80; text-decoration: none; font-weight: bold; padding: 0.5rem; }
        a:hover { color: #60a5fa; }
        .page { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .metric-card { background: #1f2937; padding: 25px; border-radius: 12px; border: 1px solid #374151; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .metric-card h3 { margin: 0 0 15px 0; color: #9ca3af; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-display { display: flex; align-items: baseline; gap: 5px; margin-bottom: 15px; }
        .metric-display .value { font-size: 2.5rem; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; }
        .metric-display .unit { color: #60a5fa; font-weight: 600; }
        .status-badge { font-weight: 600; color: #34d399; }
        .btn-action { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-action:hover { background: #2563eb; }
        .alert-banner { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
</head>
<body>
    <div id="app"></div>

</body>
</html>
