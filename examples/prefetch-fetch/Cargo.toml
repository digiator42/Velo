[package]
name = "prefetch-fetch"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
velo = { path = "../../crates/velo", features = ["json"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
console_error_panic_hook = "0.1"

[dependencies.serde]
workspace = true
features = ["derive"]