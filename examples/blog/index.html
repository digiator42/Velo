<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velo Blog</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
        a { color: #7dd3fc; text-decoration: none; font-weight: 600; padding: 0.4rem 0.6rem; border-radius: 6px; }
        a:hover { background: #1e293b; }
        nav { display: flex; gap: 8px; align-items: center; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #111827; border-bottom: 1px solid #1f2937; }
        .brand { font-weight: 800; color: #38bdf8; font-size: 1.1rem; }
        button.layout-count { background: transparent; border: 1px solid #334155; color: #a5f3fc; padding: 6px 12px; border-radius: 8px; font-weight: 600; }
        button.layout-count:hover { background: #1e293b; }
        main { padding: 32px 24px; max-width: 720px; margin: 0 auto; }
        .post { border: 1px solid #1f2937; border-radius: 10px; padding: 24px; background: #111827; }
        h1 { margin-top: 0; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px 12px; border: 1px solid #1f2937; border-radius: 8px; margin-bottom: 8px; background: #111827; }
        .not-found { text-align: center; padding: 48px 24px; }
        code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #a5f3fc; }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
    <!-- Velo dev-only error overlay (inert outside `trunk serve`). -->
    <script src="velo-error-overlay.js"></script>
    <link data-trunk rel="copy-file" href="velo-error-overlay.js"/>
</head>
<body>
    <div id="app"></div>
</body>
</html>
