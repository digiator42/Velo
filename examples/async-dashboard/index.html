<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velo Async Dashboard</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
        a { color: #7dd3fc; text-decoration: none; font-weight: 600; padding: 0.4rem 0.6rem; border-radius: 6px; }
        a:hover { background: #1e293b; }
        header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: #111827; border-bottom: 1px solid #1f2937; }
        .brand { font-weight: 800; color: #38bdf8; font-size: 1.1rem; }
        main { padding: 28px 24px; max-width: 720px; margin: 0 auto; }
        .card { border: 1px solid #1f2937; border-radius: 10px; padding: 20px; background: #111827; margin: 12px 0; }
        .muted { color: #94a3b8; }
        .live { color: #a78bfa; font-weight: 700; }
        .velo-error-boundary { border: 1px solid #ef4444; background: #450a0a; color: #fecaca; padding: 16px 20px; border-radius: 10px; }
        .velo-loading { border: 1px solid #334155; background: #1e293b; padding: 14px 20px; border-radius: 10px; color: #cbd5e1; }
        button { background: #0ea5e9; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #a5f3fc; }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
</head>
<body>
    <div id="app"></div>
</body>
</html>
